name: Test (CPU)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-cpu:
    name: Test (py${{ matrix.python-version }}, CPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Without the gpu extra: pycuda is not installed, as on a machine without CUDA.
      - name: Install instagraal with test extras
        run: pip install ".[test]"

      - name: Check that nothing needs pycuda
        run: |
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pycuda') is not None)"
          instagraal-endtoend --help > /dev/null
          instagraal-refine --help > /dev/null

      - name: Run pytest (GPU tests auto-skipped)
        run: pytest -v --tb=short --junitxml=test-results.xml

      # The stub (distribution name "pycuda", no CUDA needed) lets the MCMC module
      # import, so that its dispatch test runs here too.
      - name: Run the MCMC dispatch test with a pycuda stub
        run: |
          pip install ./tools/pycuda-stub/
          pytest -v --tb=short --cov-append tests/test_instagraal.py -k test_run_instagraal_calls_existing_methods

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cpu-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-cpu-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
