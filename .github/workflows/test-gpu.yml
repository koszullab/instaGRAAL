name: Test (GPU)

# The GPU tests run on RunPod pods, each registered as a single-use (JIT)
# self-hosted runner; see .github/runpod/. A pod is billed until it is
# terminated, so four independent safeguards keep it from outliving the run:
#   1. a pod terminates itself as soon as its runner exits;
#   2. the stop-runners job terminates every pod named after this run, even
#      if the launch step failed midway, and fails if one survives;
#   3. a watchdog inside each pod terminates it POD_TTL_MINUTES after launch,
#      whatever happens to the workflow;
#   4. gpu-pod-reaper.yml terminates CI pods older than POD_TTL_MINUTES + 15.
#
# Runs on pull requests that change what the GPU tests exercise (see
# `paths`), on pushes whose commit message contains "[gpu]", and on manual
# dispatch.
#
# To retry, use "Re-run all jobs". "Re-run failed jobs" starts no pods: the
# test jobs would wait for runners that no longer exist until GitHub drops
# them (no cost, but the run hangs; cancel it).

on:
  workflow_dispatch:
  push:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test-gpu.yml"
      - ".github/runpod/**"

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hard limit on the lifetime of each pod (safeguard 3). Keep it above the
  # start-runners + test-gpu timeouts (20 + 30 min) and below
  # MAX_POD_AGE_MINUTES in gpu-pod-reaper.yml.
  POD_TTL_MINUTES: 60
  # Pods and runners of this run are named <POD_PREFIX>py<ver>-cuda<ver>.
  POD_PREFIX: gha-instagraal-${{ github.run_id }}-${{ github.run_attempt }}-

jobs:

  # ---------------------------------------------------------------------------
  # Launch one pod per Python x CUDA combo, each running a JIT runner, and
  # output the matrix of runner labels for test-gpu.
  # ---------------------------------------------------------------------------
  start-runners:
    name: Start pods
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pull requests from forks get no secrets: they cannot start pods.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && contains(github.event.head_commit.message, '[gpu]'))
    outputs:
      matrix: ${{ steps.launch.outputs.matrix }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runpod
          persist-credentials: false

      - name: Launch pods
        id: launch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          # One pod per combo. Python is installed by setup-python; CUDA comes
          # from the image. Use images with CUDA ≤ 12.6: newer ones need very
          # recent drivers, which few RunPod hosts have.
          COMBOS: |
            [
              { "python-version": "3.10", "cuda-version": "12.1.1", "image": "nvidia/cuda:12.1.1-devel-ubuntu22.04" },
              { "python-version": "3.11", "cuda-version": "12.1.1", "image": "nvidia/cuda:12.1.1-devel-ubuntu22.04" },
              { "python-version": "3.12", "cuda-version": "12.1.1", "image": "nvidia/cuda:12.1.1-devel-ubuntu22.04" },

              { "python-version": "3.10", "cuda-version": "12.4.1", "image": "nvidia/cuda:12.4.1-devel-ubuntu22.04" },
              { "python-version": "3.11", "cuda-version": "12.4.1", "image": "nvidia/cuda:12.4.1-devel-ubuntu22.04" },
              { "python-version": "3.12", "cuda-version": "12.4.1", "image": "nvidia/cuda:12.4.1-devel-ubuntu22.04" }
            ]
          # GPU types to try in turn when RunPod has none of the previous ones,
          # cheapest first: the tests need little GPU. Secure cloud prices per
          # pod-hour (Nov 2026): RTX 2000 Ada $0.24, A4000 $0.25, A4500 $0.25,
          # A5000 $0.27, RTX 4000 Ada $0.28, RTX 3090 $0.50 (RTX 4090 $0.89).
          # Keep to Ampere and Ada GPUs: CUDA 12.1/12.4 cannot compile for
          # Blackwell ones (RTX 50xx, RTX PRO).
          GPU_TYPES: |
            NVIDIA RTX 2000 Ada Generation
            NVIDIA RTX A4000
            NVIDIA RTX A4500
            NVIDIA RTX A5000
            NVIDIA RTX 4000 Ada Generation
            NVIDIA GeForce RTX 3090
        run: bash .github/runpod/ci.sh launch

      - name: Wait for the runners to come online
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATRIX: ${{ steps.launch.outputs.matrix }}
          WAIT_MINUTES: 12
        run: bash .github/runpod/ci.sh wait-online

  # ---------------------------------------------------------------------------
  # Run the full test suite — one job per Python × CUDA combo.
  # ---------------------------------------------------------------------------
  test-gpu:
    name: Test (py${{ matrix.python-version }} / CUDA ${{ matrix.cuda-version }})
    needs: start-runners
    runs-on: ${{ matrix.label }}
    # Below POD_TTL_MINUTES, so that a hung test fails the job before the pod
    # watchdog kills the runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.start-runners.outputs.matrix) }}
    steps:
      - name: Verify GPU
        run: nvidia-smi

      - name: Set up CUDA environment
        run: |
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          echo "CUDA_INC_DIR=/usr/local/cuda/include" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify CUDA toolkit
        run: nvcc --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install instagraal with test extras
        run: pip install ".[test]"

      - name: Run pytest
        run: pytest -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}
          path: test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}
          path: |
            coverage.xml
            htmlcov/

  # ---------------------------------------------------------------------------
  # Terminate every pod of this run and deregister its runners. Runs even on
  # failure or cancellation; finds pods by name, not from start-runners
  # outputs, which are missing when the launch step fails.
  # ---------------------------------------------------------------------------
  stop-runners:
    name: Stop pods
    runs-on: ubuntu-latest
    needs: [start-runners, test-gpu]
    if: always() && needs.start-runners.result != 'skipped'
    timeout-minutes: 15
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runpod
          persist-credentials: false

      - name: Terminate pods and deregister runners
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash .github/runpod/ci.sh cleanup
