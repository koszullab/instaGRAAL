[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instagraal"
version = "0.2.0"
description = "Large genome reassembly based on Hi-C data"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Lyam Baudry", email = "lyam.baudry@pasteur.fr" },
    { name = "Hervé Marie-Nelly" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "biopython>=1.78",
    "click",
    "cooler",
    "pandas",
    "pyfaidx",
]
[project.optional-dependencies]
# the MCMC scaffolder (instagraal, and instagraal-endtoend modes with mcmc) runs on a CUDA GPU;
# building pycuda needs the CUDA toolkit
gpu = [
    "pycuda",
]
test = [
    "coverage[toml]",
    "isort",
    "python-dotenv",
    "pytest",
    "pytest-cov",
    "pytest-order",
    "ruff",
]
dev = [
    "instagraal[test]",
    "bump-my-version>=0.28",
    "pre-commit",
    "pylint",
    "mypy",
    "black",
    "ruff",
    "twine",
    "ipython"
]

[dependency-groups]
# The documentation site (docs/ and zensical.toml): `uv run --only-group docs
# zensical serve`. A group rather than an extra, so that it installs without
# instaGRAAL and pycuda: the Python API pages read the sources in src/.
docs = [
    "zensical>=0.0.43",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/koszullab/instagraal"
Documentation = "https://koszullab.github.io/instagraal/"
Repository = "https://github.com/koszullab/instagraal"
Changelog = "https://koszullab.github.io/instagraal/changelog/"

[project.scripts]
instagraal = "instagraal.cli.main:main"
instagraal-endtoend = "instagraal.cli.endtoend:main"
instagraal-polish = "instagraal.cli.polish:main"
instagraal-post = "instagraal.cli.post:main"
instagraal-pre = "instagraal.cli.pre:main"
instagraal-refine = "instagraal.cli.refine:main"
instagraal-stats = "instagraal.cli.stats:main"
instagraal-test = "instagraal.cli.test:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instagraal"]
# tests/data/ is intentionally omitted – test data is not shipped in the wheel.

[tool.hatch.build.targets.sdist]
include = [
    "src/instagraal/",
    "scripts/",
    "tests/data/",
    "README.md",
    "LICENSE",
]

[tool.black]
line-length = 130

[tool.ruff]
line-length = 130
src = ["src"]
exclude = [
    "bench/*",
    ".venv",
    "__main__.py",
]
lint.ignore = ["E402", "I001", "B008", "B006"]
lint.extend-select = [
    "B",  # bugbear
    "E",  # style errors
    "F",  # pyflakes
    "I",  # isort
    "RUF", # ruff-specific rules
    # "UP", # pyupgrade
    "W",  # style  warnings
]
lint.isort.known-first-party = ["instagraal"]

[tool.pytest.ini_options]
markers = ["order: mark test to run in a specific order"]
minversion = "7"
log_cli_level = "INFO"
xfail_strict = true
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=instagraal",
    "--cov-config=pyproject.toml",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
filterwarnings = ["ignore::PendingDeprecationWarning"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
# Third-party scientific/CUDA libraries have no stubs; ignore missing imports
# rather than failing on every numpy/scipy/pycuda reference.
ignore_missing_imports = true

[tool.bumpversion]
# `version` in [project] is the single source of the version (instagraal.__version__
# reads it from the installed package); current_version is bump-my-version's copy of it.
# See "Releasing" in docs/contributing.md.
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore(release): v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'
regex = true

[[tool.bumpversion.files]]
# The version the documentation's header and footer show.
filename = "zensical.toml"
search = 'release = "{current_version}"'
replace = 'release = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Dockerfile"
search = "Version={current_version}"
replace = "Version={new_version}"

[[tool.bumpversion.files]]
# Promote the "Unreleased" entries to a dated section and open a fresh one.
filename = "docs/changelog.md"
search = "## Unreleased"
replace = "## Unreleased\n\n## [{new_version}] - {now:%Y-%m-%d}"
